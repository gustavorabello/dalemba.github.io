<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG|default('pt-br') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page %}{{ page.title }} | {% endif %}{{ SITENAME }}</title>
  {% if page and page.summary %}
  <meta name="description" content="{{ page.summary|striptags }}">
  {% endif %}
  <link rel="stylesheet" href="{{ SITEURL }}/static/css/main.css">
</head>
<body data-page-type="{{ page.page_type if page and page.page_type else 'default' }}" data-page-slug="{% if page %}{{ page.slug }}{% endif %}">
  <div class="site-bg"></div>
  <header class="site-header">
    <a class="brand" href="{{ SITEURL }}/">
      <span class="brand-mark">misc-site</span>
      <span class="brand-tag">{{ SITESUBTITLE }}</span>
    </a>
    <nav class="site-nav" aria-label="Principal">
      {% for label, url in MENUITEMS %}
      <a href="{{ url }}">{{ label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ SITEURL }}/static/js/site.js"></script>
</body>
</html>
